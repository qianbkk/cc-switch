# release-portable.yml — 魔改版专用 release:只产 Windows Portable.zip(绿色版)
#
# 与上游 release.yml 互不干扰:
#   - 上游 release.yml 在 push v* tag 时跑完整 5 平台矩阵 + Apple/Windows 签名
#   - 此 workflow 在 push m* tag 时只跑 Windows Portable.zip(免安装、无需签名证书)
#
# Tag 命名规则:
#   m<upstream-version>-<patch>
#   例:m3.19.1-1(基于 upstream v3.19.1 的第 1 个魔改版)。
#   上游版本变化时 revision 从 1 重新开始；同一上游版本的后续魔改依次递增。
#   历史 custom-v3.18.0-* tag 保留(下载链接继续有效),但不建议再推新 custom-*。
#
# 用法:
#   git tag m3.19.1-1
#   git push origin m3.19.1-1
# 完成后到 https://github.com/qianbkk/cc-switch/releases 下载 zip

name: Release Portable (Windows)

on:
  push:
    tags:
      - 'm*'

permissions:
  contents: write

concurrency:
  group: release-portable-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        shell: pwsh
        run: |
          npm install -g pnpm@10
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (exe only, no installers)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 编译进二进制，供魔改版 updater 判断当前 m* 修订号。
          CC_SWITCH_FORK_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # 必须用 `tauri build --no-bundle`，不能用裸 `cargo build --release`：
          #
          # Tauri CLI 的 build 命令会自动注入 `tauri/custom-protocol` feature
          # (crates/tauri-cli/src/interface/rust.rs build_options)，使发布版把
          # dist 前端资源嵌入二进制，并通过 tauri://localhost 协议加载。
          # 而裸 `cargo build --release` 不会注入该 feature —— tauri-macros 的
          # generate_context! 会以 `dev = !custom-protocol` 判定，导致资源完全不
          # 嵌入、运行时加载 `http://localhost:3000`（开发服务器）。新电脑上无
          # dev server，双击 exe 即报"无法访问此页面"。
          #
          # `--no-bundle` 跳过 msi/安装器与 updater 产物阶段（tauri build.rs
          # 中 `if !options.no_bundle && ...` 才执行 bundle），因此不需要
          # Windows 代码签名证书，也不需要 TAURI_SIGNING_PRIVATE_KEY。
          # 前端由 tauri 的 beforeBuildCommand(= pnpm build:renderer) 自动构建。
          pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc

      - name: Verify embedded assets (fail on dev-URL build)
        shell: pwsh
        # 校验发布 exe 是否真的嵌入了 dist 前端资源（assets/index-*.js 等）。
        # 若资源缺失 = dev 模式产物（会去连 localhost:3000），直接让 CI 失败，
        # 禁止上传错误包。脚本见 scripts/verify-embedded-assets.mjs。
        run: node scripts/verify-embedded-assets.mjs

      - name: Package portable zip
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          # 找 cc-switch.exe(默认 release target 路径)
          $exeCandidates = @(
            'src-tauri/target/x86_64-pc-windows-msvc/release/cc-switch.exe',
            'src-tauri/target/release/cc-switch.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -eq $exePath) {
            throw 'cc-switch.exe not found after build'
          }

          $portableDir = 'release-assets/CC-Switch-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir

          $portableIniPath = Join-Path $portableDir 'portable.ini'
          @(
            '# CC Switch portable build (魔改版)',
            'portable=true'
          ) | Set-Content -Path $portableIniPath -Encoding UTF8

          $portableZip = "release-assets/CC-Switch-$env:VERSION-Windows-Portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
          Remove-Item -Recurse -Force $portableDir

          Write-Host "✅ Portable zip created: $portableZip"
          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch 魔改版 ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            ## CC Switch 魔改版

            这是 [farion1231/cc-switch](https://github.com/farion1231/cc-switch) 的个人魔改分支。
            基于 v3.19.1 上游合入 + 魔改独占功能（统一网关 / Live 配置保护 / Codex auth 保护 / 魔改功能总开关与隐藏功能 UI / fork 预发行版更新）。

            ### 下载

            **Windows 绿色版**（解压双击 CC Switch.exe 即用，无需安装）：

            - `CC-Switch-${{ github.ref_name }}-Windows-Portable.zip`

            ### 已知差异（vs 上游发布版）

            - 已剔除上游赞助商推广位（README 段）
            - 已隐藏云同步设置入口（代码保留）
            - 已同步至上游 v3.19.1，并保留全部魔改扩展

            ### 配套说明

            - 部署文档：[docs/CUSTOM_FORK_PLAN.md](https://github.com/qianbkk/cc-switch/blob/main/docs/CUSTOM_FORK_PLAN.md)
            - 同步上游工具：`scripts/sync-upstream.sh`
          files: |
            release-assets/CC-Switch-${{ github.ref_name }}-Windows-Portable.zip
          fail_on_unmatched_files: true
