name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # On pull_request the filter reads changed files via the API (no checkout);
      # on push it needs a local git history to diff against.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "src/**"
              - "tests/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "tailwind.config.cjs"
              - "postcss.config.cjs"
              - "components.json"
              - "scripts/**"
              - ".github/workflows/**"
            backend:
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - ".github/workflows/**"

  frontend:
    name: Frontend Checks
    # 前端检查与平台无关，保留 ubuntu runner（更快更便宜）
    runs-on: ubuntu-latest
    needs: changes
    # Pushes to main always run everything: they keep the caches that PRs restore from warm.
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 完整历史：魔改详情生成器需要 rev-list 统计 fork 独有提交
          fetch-depth: 0

      - name: Fetch upstream (for fork stats)
        # 生成器以 upstream/main 为对比基线统计 fork 独有提交/文件/代码行
        run: |
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch upstream main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 版本一致性校验（第 19 项）：package.json / tauri.conf.json / Cargo.toml
      # 三处 version 必须一致；发布时 CC_SWITCH_FORK_RELEASE_TAG 的基础版本必须
      # 等于应用版本（错误 tag 直接阻止发布）。
      - name: Check version sync
        run: node scripts/check-version-sync.mjs

      # 魔改详情生成物校验（第 20 项）：运行生成器，若与已提交的
      # FORK_CHANGES.html 不一致则 CI 失败——强制提交前更新生成物，
      # 杜绝页面数字/描述过期。PR 场景 checkout 是 merge ref（无 main
      # 分支），fetch origin/main 建 ref；基线用页面记录的 hash 复现
      #（消除上游实时位置漂移），HEAD 口径与本地一致。
      - name: Check fork changes freshness
        run: |
          git fetch origin main
          git fetch upstream main
          BASE=$(node -e "const m=require('fs').readFileSync('src-tauri/assets/FORK_CHANGES.html','utf8').match(/对比上游基线\s*<code>([a-f0-9]+)<\/code>/); process.stdout.write(m?m[1]:'')")
          echo "复现基线: $BASE"
          node scripts/generate-fork-changes.mjs --head origin/main --base "$BASE"
          git diff --exit-code -- src-tauri/assets/FORK_CHANGES.html

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build renderer and verify dist integrity
        # 发布流程依赖 vite 产物（dist/），校验 index.html 引用的资源真实存在，
        # 避免把残缺的 dist 打成发布包。
        run: |
          pnpm build:renderer
          node scripts/verify-embedded-assets.mjs --check-dist-only

  backend:
    name: Backend Checks (windows)
    # 魔改版仅维护 Windows 平台，不再跑 macOS/Linux 后端检查
    runs-on: windows-latest
    needs: changes
    # Pushes to main always run everything: they keep the caches that PRs restore from warm.
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  portable-build:
    name: Portable Release Smoke (embedded assets)
    # 发布烟测：完整跑一遍绿色版发布构建路径（tauri build --no-bundle 注入
    # custom-protocol），并校验发布 exe 确实嵌入了 dist 前端资源。若资源缺失
    # （dev 模式产物、会连 localhost:3000），CI 立即失败，禁止发布错误包。
    runs-on: windows-latest
    needs: changes
    # Rust/tauri 构建属于 backend 区域，纯前端改动时跳过（保持与 backend 一致的门控）
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-portable-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-portable-cargo-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (exe only, no installers)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc

      - name: Verify embedded assets (fail on dev-URL build)
        shell: pwsh
        run: node scripts/verify-embedded-assets.mjs
