    about: |
      本仓库是 farion1231/cc-switch 的个人魔改 fork。
      如果问题在官方原版里同样存在，请去上游反馈，那里才有维护团队。
      This is a personal fork. If the issue also happens in the original
      project, please report it upstream instead.
